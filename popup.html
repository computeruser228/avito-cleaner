
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 310px;
      margin: 0;
      padding: 20px;
      background: #17191d;
      color: #e5e7eb;
      font: 13px "Segoe UI", Arial, sans-serif;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 18px;
      border-bottom: 1px solid #303239;
      margin-bottom: 18px;
    }

    .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        flex-shrink: 0;
        overflow: hidden;
        border-radius: 12px;
        background: #30343b;
        }

    .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    h3 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 650;
        line-height: 1.4;
        letter-spacing: -0.3px;
    }

    .subtitle {
      color: #858b98;
      font-size: 11px;
    }

    .section-title {
      margin: 20px 0 10px;
      color: #858b98;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .settings {
      overflow: hidden;
      border: 1px solid #303239;
      border-radius: 12px;
      background: #202227;
    }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 57px;
      padding: 12px;
      margin: 0;
      cursor: pointer;
    }

    .setting + .setting {
      border-top: 1px solid #303239;
    }

    .setting-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .setting-name {
      color: #e5e7eb;
      font-size: 12px;
      font-weight: 550;
    }

    .setting-description {
      color: #858b98;
      font-size: 10px;
      line-height: 1.4;
    }

    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      flex: 0 0 36px;
      width: 36px;
      height: 21px;
      margin: 0;
      border: 1px solid #50535d;
      border-radius: 20px;
      background: #373a42;
      cursor: pointer;
      position: relative;
      transition: background 0.2s, border-color 0.2s;
    }

    input[type="checkbox"]::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #c5c8d0;
      transition: transform 0.2s, background 0.2s;
    }

    input[type="checkbox"]:checked {
      background: #64748b;
      border-color: #94a3b8;
    }

    input[type="checkbox"]:checked::before {
      transform: translateX(15px);
      background: #fff;
    }

    input[type="checkbox"]:focus-visible,
    select:focus-visible,
    button:focus-visible {
      outline: 2px solid #94a3b8;
      outline-offset: 3px;
    }

    .select-wrap {
      padding: 12px;
      border-top: 1px solid #303239;
    }

    .select-wrap label {
      display: block;
      margin-bottom: 9px;
      color: #b9bdc7;
      font-size: 11px;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #3b3e47;
      border-radius: 8px;
      background: #292c33;
      color: #e5e7eb;
      font: inherit;
      cursor: pointer;
    }

    select:hover {
      border-color: #626775;
    }

    .save {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #777e8b;
      border-radius: 9px;
      background: #555d6b;
      color: #fff;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .save:hover {
      background: #687181;
    }

    .save:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 14px;
      color: #696f7b;
      font-size: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
        <img src="icon48.png" alt="Avito Cleaner">
    </div>
    <div>
      <h3>Avito Cleaner: Reserved Ads</h3>
      <div class="subtitle">Настройки фильтрации</div>
    </div>
  </div>

  <div class="section-title">Основные настройки</div>

  <div class="settings">
    <label class="setting" for="enabled">
      <span class="setting-text">
        <span class="setting-name">Фильтр объявлений</span>
        <span class="setting-description">Обрабатывать забронированные товары</span>
      </span>
      <input type="checkbox" id="enabled">
    </label>

    <div class="select-wrap">
      <label for="mode">Способ фильтрации</label>
      <select id="mode">
        <option value="hide">Скрывать объявления</option>
        <option value="blur">Размывать объявления</option>
      </select>
    </div>
  </div>

  <div class="section-title">Внешний вид</div>

  <div class="settings">
    <label class="setting" for="hideCategories">
      <span class="setting-text">
        <span class="setting-name">Убрать верхнюю панель категорий</span>
        <span class="setting-description">Освободить место на странице</span>
      </span>
      <input type="checkbox" id="hideCategories">
    </label>

    <label class="setting" for="unblurOnHover">
      <span class="setting-text">
        <span class="setting-name">Размытие при наведении</span>
        <span class="setting-description">Показывать товар под курсором</span>
      </span>
      <input type="checkbox" id="unblurOnHover">
    </label>
  </div>

  <button class="save" id="save">Сохранить настройки</button>

  <div class="footer">Avito Cleaner: Reserved Ads</div>

  <script src="popup.js"></script>
</body>
</html>
